services:
  - type: web
    name: fleet-tracking-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fleet-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: FRONTEND_ORIGIN
        sync: false
        value: "https://<your-vercel-app>.vercel.app"

databases:
  - name: fleet-db
    plan: free
    databaseName: fleet_tracking
    ipAllowList: []
